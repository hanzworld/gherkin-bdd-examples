# Builds and tests both language implementations (C# and Java) at all three
# levels described in the README: unit, integration, and Cypress E2E.
#
# The two language stacks are fully independent, so their stages run in
# parallel (dependsOn: [] on both) to keep pipeline time down.
#
# Manual tests: a Gherkin scenario with no automated implementation is
# tagged @manual (see scripts/find-manual-tests.mjs and the two example
# scenarios in cypress/e2e/features/account.feature). Automated runners are
# configured to skip @manual scenarios (Reqnroll: `Category!=manual` test
# filter; Cucumber-JVM: FILTER_TAGS_PROPERTY_NAME on the suite classes;
# Cypress: `tags: 'not @manual'` in cypress.config.js). If any exist, the
# pipeline stops after the automated stages and waits for a human to run
# them and record PASS/FAIL against the `manual-testing` Environment's
# approval gate. This requires a one-time setup by a project admin:
#   Project Settings -> Environments -> New -> name it "manual-testing"
#   -> Approvals and checks -> Approvals -> add the people/groups who are
#   allowed to sign off on manual testing.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  # ---------------------------------------------------------------------
  # Scan every .feature file for @manual scenarios and publish a checklist.
  # Doesn't depend on / block the automated stages - they run in parallel.
  # ---------------------------------------------------------------------
  - stage: DetectManualTests
    dependsOn: []
    jobs:
      - job: Detect
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '20.x'

          - script: node scripts/find-manual-tests.mjs "$(Build.ArtifactStagingDirectory)/manual-tests"
            displayName: 'Scan .feature files for @manual scenarios'

          - script: |
              COUNT=$(node -e "console.log(require('$(Build.ArtifactStagingDirectory)/manual-tests/manual-test-summary.json').count)")
              echo "Manual scenario count: $COUNT"
              echo "##vso[task.setvariable variable=manualTestCount;isOutput=true]$COUNT"
            name: manualCheck
            displayName: 'Set manualTestCount output variable'

          - publish: '$(Build.ArtifactStagingDirectory)/manual-tests'
            artifact: 'manual-test-checklist'
            displayName: 'Publish manual test checklist'

  # ---------------------------------------------------------------------
  # C#: dotnet build + unit/integration tests, then Cypress E2E against
  # the running API.
  # ---------------------------------------------------------------------
  - stage: CSharp
    dependsOn: []
    jobs:
      - job: BuildAndTest
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 8 SDK (runtime for net8.0 app/tests)'
            inputs:
              packageType: sdk
              version: '8.0.x'

          - task: UseDotNet@2
            displayName: 'Install .NET 9 SDK (CLI support for .slnx solutions)'
            inputs:
              packageType: sdk
              version: '9.0.x'

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: 'npm ci (frontend)'
            workingDirectory: csharp/frontend

          - script: npm test
            displayName: 'Frontend unit tests (Jest)'
            workingDirectory: csharp/frontend

          - task: PublishTestResults@2
            displayName: 'Publish frontend unit test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'results/junit.xml'
              searchFolder: 'csharp/frontend'
              testRunTitle: 'C# frontend unit tests (Jest)'

          - script: npm run build
            displayName: 'ng build (frontend -> wwwroot)'
            workingDirectory: csharp/frontend

          - script: dotnet restore BankAccount.slnx
            displayName: 'dotnet restore'
            workingDirectory: csharp

          - script: dotnet build BankAccount.slnx --configuration Release --no-restore
            displayName: 'dotnet build'
            workingDirectory: csharp

          - script: |
              dotnet test BankAccount.slnx \
                --configuration Release \
                --no-build \
                --filter "Category!=manual" \
                --logger trx \
                --results-directory "$(Agent.TempDirectory)/testresults"
            displayName: 'dotnet test (unit + integration)'
            workingDirectory: csharp

          - task: PublishTestResults@2
            displayName: 'Publish .NET test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: '$(Agent.TempDirectory)/testresults'
              testRunTitle: 'C# unit + integration tests'

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: 'npm ci (E2E)'
            workingDirectory: csharp/e2e

          - script: |
              set -e
              nohup dotnet run --project backend/src/BankAccount.Api --configuration Release \
                > "$(Agent.TempDirectory)/api.log" 2>&1 &
              echo "$!" > "$(Agent.TempDirectory)/api.pid"

              echo "Waiting for API to become available on http://localhost:5080 ..."
              for i in $(seq 1 60); do
                if curl -sf http://localhost:5080 -o /dev/null; then
                  echo "API is up."
                  exit 0
                fi
                sleep 2
              done

              echo "API did not start in time. Log output:"
              cat "$(Agent.TempDirectory)/api.log"
              exit 1
            displayName: 'Start API'
            workingDirectory: csharp

          - script: npx cypress run
            displayName: 'Cypress E2E tests'
            workingDirectory: csharp/e2e

          - task: PublishTestResults@2
            displayName: 'Publish Cypress E2E test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'results/*.xml'
              searchFolder: 'csharp/e2e'
              testRunTitle: 'C# E2E tests (Cypress)'

          - script: |
              if [ -f "$(Agent.TempDirectory)/api.pid" ]; then
                kill "$(cat "$(Agent.TempDirectory)/api.pid")" || true
              fi
            displayName: 'Stop API'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Cypress artifacts on failure'
            condition: failed()
            inputs:
              targetPath: 'csharp/e2e/cypress'
              artifact: 'csharp-cypress-output'

  # ---------------------------------------------------------------------
  # Java: Maven build + unit/integration tests, then Cypress E2E against
  # the running Spring Boot app.
  # ---------------------------------------------------------------------
  - stage: Java
    dependsOn: []
    jobs:
      - job: BuildAndTest
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Install JDK 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: 'npm ci (frontend)'
            workingDirectory: java/frontend

          - script: npm test
            displayName: 'Frontend unit tests (Jest)'
            workingDirectory: java/frontend

          - task: PublishTestResults@2
            displayName: 'Publish frontend unit test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'results/junit.xml'
              searchFolder: 'java/frontend'
              testRunTitle: 'Java frontend unit tests (Jest)'

          - script: npm run build
            displayName: 'ng build (frontend -> static)'
            workingDirectory: java/frontend

          - task: Maven@4
            displayName: 'mvn test (unit + integration)'
            inputs:
              mavenPomFile: 'java/backend/pom.xml'
              goals: 'test'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Java unit + integration tests'

          - script: mvn --batch-mode package -DskipTests
            displayName: 'mvn package (build jar for E2E)'
            workingDirectory: java/backend

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: 'npm ci (E2E)'
            workingDirectory: java/e2e

          - script: |
              set -e
              nohup java -jar target/bank-account-app.jar \
                > "$(Agent.TempDirectory)/api.log" 2>&1 &
              echo "$!" > "$(Agent.TempDirectory)/api.pid"

              echo "Waiting for API to become available on http://localhost:8080 ..."
              for i in $(seq 1 60); do
                if curl -sf http://localhost:8080 -o /dev/null; then
                  echo "API is up."
                  exit 0
                fi
                sleep 2
              done

              echo "API did not start in time. Log output:"
              cat "$(Agent.TempDirectory)/api.log"
              exit 1
            displayName: 'Start Spring Boot app'
            workingDirectory: java/backend

          - script: npx cypress run
            displayName: 'Cypress E2E tests'
            workingDirectory: java/e2e

          - task: PublishTestResults@2
            displayName: 'Publish Cypress E2E test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'results/*.xml'
              searchFolder: 'java/e2e'
              testRunTitle: 'Java E2E tests (Cypress)'

          - script: |
              if [ -f "$(Agent.TempDirectory)/api.pid" ]; then
                kill "$(cat "$(Agent.TempDirectory)/api.pid")" || true
              fi
            displayName: 'Stop Spring Boot app'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Cypress artifacts on failure'
            condition: failed()
            inputs:
              targetPath: 'java/e2e/cypress'
              artifact: 'java-cypress-output'

  # ---------------------------------------------------------------------
  # Only runs if DetectManualTests found @manual scenarios. Pauses on the
  # 'manual-testing' Environment's approval check (portal-configured, see
  # header comment) so a human can run those scenarios and record results,
  # then captures what they entered and publishes it as an artifact.
  # ---------------------------------------------------------------------
  - stage: ManualApproval
    dependsOn:
      - DetectManualTests
      - CSharp
      - Java
    condition: |
      and(
        succeeded('DetectManualTests'),
        in(dependencies.CSharp.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.Java.result, 'Succeeded', 'SucceededWithIssues'),
        gt(dependencies.DetectManualTests.outputs['Detect.manualCheck.manualTestCount'], 0)
      )
    jobs:
      - deployment: WaitForManualTesting
        displayName: 'Wait for manual test results'
        environment: manual-testing
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs don't auto-checkout the repo like regular
                # jobs do - capture-manual-test-results.mjs lives in it.
                - checkout: self

                - task: UseNode@1
                  displayName: 'Install Node.js'
                  inputs:
                    version: '20.x'

                - download: current
                  artifact: manual-test-checklist
                  displayName: 'Download manual test checklist'

                - script: |
                    echo "The following scenarios have no automated test and need a human to run them:"
                    echo ""
                    cat "$(Pipeline.Workspace)/manual-test-checklist/manual-test-checklist.md"
                  displayName: 'Show manual test checklist'

                - script: |
                    node scripts/capture-manual-test-results.mjs \
                      --org "$(System.CollectionUri)" \
                      --project "$(System.TeamProject)" \
                      --build-id "$(Build.BuildId)" \
                      --summary "$(Pipeline.Workspace)/manual-test-checklist/manual-test-summary.json" \
                      --out "$(Build.ArtifactStagingDirectory)/manual-test-results"
                  displayName: 'Capture manual test results from approval comment'
                  workingDirectory: '$(Build.SourcesDirectory)'
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  # Best-effort: scraping the typed comment back out of the
                  # Approvals API is the one part of this pipeline that
                  # hasn't been verified against a live org (see script
                  # header). Never fail the run over it - the checklist and
                  # the Approvals panel on this run remain authoritative.
                  continueOnError: true

                - publish: '$(Build.ArtifactStagingDirectory)/manual-test-results'
                  artifact: 'manual-test-results'
                  displayName: 'Publish manual test results'

                - task: PublishTestResults@2
                  displayName: 'Publish manual test results to Tests tab'
                  condition: succeededOrFailed()
                  inputs:
                    testResultsFormat: JUnit
                    testResultsFiles: 'manual-test-results.xml'
                    searchFolder: '$(Build.ArtifactStagingDirectory)/manual-test-results'
                    testRunTitle: 'Manual tests'
