<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bank Account</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; }
    fieldset { margin-bottom: 1.5rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; }
    input { padding: 0.35rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; }
    #balance-panel { display: none; }
    #error { color: #b00020; min-height: 1.25rem; }
  </style>
</head>
<body>
  <h1>Bank Account</h1>

  <fieldset id="open-panel">
    <legend>Open account</legend>
    <label for="owner">Owner</label>
    <input id="owner" type="text" placeholder="Ada Lovelace" />
    <label for="opening-balance">Opening balance</label>
    <input id="opening-balance" type="number" value="100" />
    <button id="open-account">Open account</button>
  </fieldset>

  <fieldset id="balance-panel">
    <legend>Account <span id="account-id"></span></legend>
    <p>Balance: <strong id="balance">0</strong></p>

    <label for="deposit-amount">Deposit amount</label>
    <input id="deposit-amount" type="number" value="50" />
    <button id="deposit">Deposit</button>

    <label for="withdraw-amount">Withdraw amount</label>
    <input id="withdraw-amount" type="number" value="50" />
    <button id="withdraw">Withdraw</button>
  </fieldset>

  <p id="error"></p>

  <script>
    let accountId = null;

    const $ = (id) => document.getElementById(id);

    async function openAccount() {
      $('error').textContent = '';
      const response = await fetch('/api/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          owner: $('owner').value,
          openingBalance: Number($('opening-balance').value),
        }),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        $('error').textContent = body.error ?? 'Could not open account.';
        return;
      }

      const account = await response.json();
      accountId = account.id;
      $('account-id').textContent = accountId;
      $('balance').textContent = account.balance;
      $('balance-panel').style.display = 'block';
    }

    async function transact(kind) {
      $('error').textContent = '';
      const amount = Number($(`${kind}-amount`).value);
      const response = await fetch(`/api/accounts/${accountId}/${kind}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount }),
      });

      const body = await response.json().catch(() => ({}));

      if (!response.ok) {
        $('error').textContent = body.error ?? `Could not ${kind}.`;
        return;
      }

      $('balance').textContent = body.balance;
    }

    $('open-account').addEventListener('click', openAccount);
    $('deposit').addEventListener('click', () => transact('deposit'));
    $('withdraw').addEventListener('click', () => transact('withdraw'));
  </script>
</body>
</html>
